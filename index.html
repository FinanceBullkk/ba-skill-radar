<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Canvas</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --ink:#1C1B18; --muted:#73706A; --faint:#A3A099;
  --bg:#EFEEEA; --card:#FFFFFF; --panel:#FAFAF7;
  --line:#E3E1DB; --line-strong:#CFCCC4;
  --sel:#1C1B18;
}
*{box-sizing:border-box; margin:0; padding:0;}
html, body{height:100%;}
body{font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden;}
.mono{font-family:"IBM Plex Mono", monospace;}

/* ---------- Toolbar ---------- */
#toolbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); z-index:50;}
#toolbar .brand{display:flex; align-items:baseline; gap:7px; margin-right:10px;}
#toolbar .brand b{font-weight:700; font-size:15px; letter-spacing:-0.02em;}
#toolbar .brand span{font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--faint); letter-spacing:0.08em; text-transform:uppercase;}
#toolbar .sep{width:1px; height:22px; background:var(--line); margin:0 5px;}
#toolbar .spacer{flex:1;}
button{font-family:inherit; font-size:12.5px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; transition:background .12s, border-color .12s; white-space:nowrap;}
button:hover{background:var(--panel); border-color:var(--line-strong);}
button.primary{background:var(--ink); border-color:var(--ink); color:#FFFFFF;}
button.primary:hover{background:#000000; border-color:#000000;}
button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
.hint{font-size:12px; color:var(--muted);}

/* ---------- Layout ---------- */
#main{flex:1; display:flex; min-height:0;}
#boardwrap{flex:1; overflow:auto; display:flex; justify-content:center; align-items:flex-start; padding:26px;}
#board{position:relative; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 32px rgba(28,27,24,.09); flex:none;}
#empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; color:var(--faint); font-size:13px; text-align:center; line-height:1.7;}

/* ---------- Objects ---------- */
.obj{position:absolute; box-sizing:border-box;}
.obj.sel{outline:1.5px solid var(--sel); outline-offset:2px; border-radius:2px;}
.obj-text{width:100%; min-height:1em; outline:none; line-height:1.3; cursor:grab; word-break:break-word; letter-spacing:-0.01em;}
.obj-text.editing{cursor:text;}
.obj-rect{width:100%; height:100%; cursor:grab;}
.obj-img{display:block; width:100%; height:auto; cursor:grab; pointer-events:none;}
.obj.image{cursor:grab;}
.obj-line{position:absolute; inset:0; overflow:visible; pointer-events:none;}
.obj-line .hit{pointer-events:stroke; cursor:grab; stroke:transparent; stroke-width:14;}

/* radar widget */
.widget{background:var(--card); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 2px 14px rgba(28,27,24,.10);}
.w-head{display:flex; align-items:center; gap:7px; padding:7px 10px; background:var(--panel); border-bottom:1px solid var(--line); cursor:grab; user-select:none; min-width:0;}
.w-grip{color:var(--faint); font-size:11px; flex:none;}
.w-title{font-size:12px; font-weight:600; letter-spacing:0.01em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.radar-body{flex:1; padding:8px; position:relative; min-height:0;}

/* ---------- Selection handles ---------- */
.h{position:absolute; width:11px; height:11px; background:#FFFFFF; border:1.5px solid var(--sel); border-radius:2px; z-index:5;}
.h-br{right:-7px; bottom:-7px; cursor:nwse-resize;}
.h-r{right:-7px; top:50%; transform:translateY(-50%); cursor:ew-resize;}
.h-end{border-radius:50%; cursor:grab;}
.obj-del{position:absolute; top:-12px; right:-12px; width:21px; height:21px; border-radius:50%; background:#FFFFFF; border:1.5px solid var(--sel); color:var(--ink); font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; z-index:6;}
.obj-del:hover{background:#F6E8E4; border-color:#A8442C; color:#A8442C;}

/* ---------- Inspector ---------- */
#inspector{width:300px; flex:none; background:var(--card); border-left:1px solid var(--line); overflow-y:auto; padding:16px 16px 28px 16px; display:flex; flex-direction:column; gap:18px;}
.insp-h{font-family:"IBM Plex Mono", monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; justify-content:space-between;}
.insp-h button{font-size:11px; padding:3px 8px; border-radius:6px;}
.insp-tip{font-size:12.5px; color:var(--muted); line-height:1.65;}
.insp-tip b{color:var(--ink); font-weight:600;}
.field{display:flex; flex-direction:column; gap:6px;}
.field input[type="text"], .field select{font-family:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); width:100%;}
.field input[type="text"]:focus, .field select:focus{outline:none; border-color:var(--ink);}

/* series chips */
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 10px; border:1px solid var(--line); border-radius:99px; background:var(--card); cursor:pointer; max-width:100%;}
.chip .dot{width:9px; height:9px; border-radius:50%; flex:none;}
.chip span.nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px;}
.chip.on{border-color:var(--ink); background:var(--panel); font-weight:600;}

/* series detail row */
.srow{display:flex; align-items:center; gap:7px;}
.srow .swatch{width:22px; height:22px; border-radius:6px; border:1px solid rgba(0,0,0,.12); cursor:pointer; flex:none; padding:0;}
.srow input[type="text"]{flex:1; min-width:0; font-family:inherit; font-size:12.5px; padding:5px 8px; border:1px solid var(--line); border-radius:7px; color:var(--ink);}
.srow input[type="text"]:focus{outline:none; border-color:var(--ink);}
.srow .tg{flex:none; font-family:"IBM Plex Mono", monospace; font-size:11px; padding:4px 7px; border-radius:6px; color:var(--muted);}
.srow .tg.on{background:var(--ink); border-color:var(--ink); color:#FFFFFF;}
.xbtn{flex:none; border:none; background:none; color:#A8442C; cursor:pointer; font-size:12px; padding:2px 4px;}
.xbtn:disabled{color:var(--faint); cursor:default;}

/* axes rows */
.arow{display:flex; align-items:center; gap:8px; padding:3px 0;}
.arow input[type="text"]{flex:0 0 96px; min-width:0; font-family:inherit; font-size:12.5px; padding:4px 6px; border:none; border-bottom:1px solid transparent; background:transparent; color:var(--ink);}
.arow input[type="text"]:focus{outline:none; border-bottom-color:var(--ink);}
.arow input[type="range"]{flex:1; min-width:40px; accent-color:var(--ink); height:18px;}
.arow .av{flex:0 0 34px; text-align:right; font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--muted);}
.addrow button{font-size:12px; padding:5px 10px;}

/* palette grid for shapes/text */
.pal{display:flex; gap:6px; flex-wrap:wrap;}
.pal button{width:24px; height:24px; border-radius:7px; padding:0; border:1px solid rgba(0,0,0,.12);}
.pal button.on{outline:2px solid var(--ink); outline-offset:2px;}
.optrow{display:flex; gap:6px; flex-wrap:wrap;}
.optrow button.on{background:var(--ink); color:#FFFFFF; border-color:var(--ink);}

/* capture mode: hide chrome */
.capturing .obj.sel{outline:none;}
.capturing .h, .capturing .obj-del{display:none;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#FFFFFF; font-size:13px; padding:9px 18px; border-radius:99px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:100;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand"><b>Radar</b><span>canvas</span></span>
  <span class="sep"></span>
  <button data-add="radar" title="Add a radar chart">◎ Radar</button>
  <button data-add="text">+ Text</button>
  <button data-add="rect">▭ Box</button>
  <button data-add="line">╱ Line</button>
  <button data-add="arrow">↗ Arrow</button>
  <button data-add="image">🖼 Image</button>
  <span class="spacer"></span>
  <span class="hint" id="tip">Drag to move · select a radar to edit its data →</span>
  <span class="sep"></span>
  <button class="primary" id="png">Download PNG</button>
  <button id="exp">Export</button>
  <button id="imp">Import</button>
  <button id="reset">Reset</button>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
</div>

<div id="main">
  <div id="boardwrap"><div id="board"></div></div>
  <aside id="inspector" aria-label="Inspector"></aside>
</div>
<div class="toast" id="toast"></div>

<script src="radar-core.js"></script>
<script src="radar-inspector.js"></script>
</body>
</html>
