<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BA Skill Radar — Canvas</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --ink:#1B2A3A; --muted:#5C6B7A; --bg:#EEF1F3; --card:#FFFFFF;
  --accent:#0E7A6A; --accent-deep:#0A5448; --line:#E2E7EB; --sel:#0E7A6A;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---- Toolbar: one clean row ---- */
#toolbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:9px 14px; background:var(--card); border-bottom:1px solid var(--line); box-shadow:0 1px 4px rgba(27,42,58,.04); z-index:50;}
#toolbar .brand{font-weight:600; font-size:14px; letter-spacing:-0.01em; margin-right:6px;}
#toolbar .sep{width:1px; height:22px; background:var(--line); margin:0 4px;}
#toolbar .spacer{flex:1;}
button{font-family:inherit; font-size:12.5px; padding:6px 11px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; transition:background .12s,border-color .12s; white-space:nowrap;}
button:hover{background:var(--bg); border-color:#CFD6DC;}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
button.primary:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
input[type=color]{width:30px; height:28px; border:1px solid var(--line); border-radius:7px; background:var(--card); padding:1px; cursor:pointer;}
.hint{font-size:12px; color:var(--muted);}

/* ---- Board ---- */
#boardwrap{flex:1; overflow:auto; display:flex; justify-content:center; align-items:flex-start; padding:24px;}
#board{position:relative; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px rgba(27,42,58,.10); flex:none;}

/* ---- Objects ---- */
.obj{position:absolute; box-sizing:border-box;}
.obj.sel{outline:1.5px solid var(--sel); outline-offset:1px;}
.obj-text{width:100%; min-height:1em; outline:none; line-height:1.35; cursor:grab; word-break:break-word;}
.obj-text.editing{cursor:text;}
.obj-rect{width:100%; height:100%; cursor:grab;}
.obj-img{display:block; width:100%; height:auto; cursor:grab; pointer-events:none;}
.obj.image{cursor:grab;}
.obj-line{position:absolute; inset:0; overflow:visible; pointer-events:none;}
.obj-line .hit{pointer-events:stroke; cursor:grab; stroke:transparent; stroke-width:14;}

/* widget cards (radar + table) */
.widget{background:var(--card); border:1px solid #BBC6CE; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 2px 12px rgba(27,42,58,.12);}
.obj.widget{height:auto;}
.w-head{display:flex; align-items:center; gap:6px; padding:6px 9px; background:#F7F9FA; border-bottom:1px solid var(--line); font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; cursor:grab; user-select:none;}
.w-grip{color:#AEB8C0;}
.w-body{padding:10px;}

/* score table (slider style, like the original tool) */
.tmode{display:inline-flex; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:3px; margin-bottom:9px;}
.tmode button{border:none; background:transparent; padding:3px 12px; border-radius:6px; font-size:12px; color:var(--muted);}
.tmode button.on{background:var(--card); color:var(--ink); border:1px solid var(--line); font-weight:500;}
.trow{display:flex; align-items:center; gap:9px; padding:4px 0;}
.trow + .trow{border-top:1px solid #F0F3F5;}
.tname{flex:0 0 150px; font-size:13px; border:none; background:transparent; color:var(--ink); font-family:inherit; padding:2px 0; outline:none; min-width:0;}
.tname:focus{border-bottom:1px solid var(--accent);}
.tslider{flex:1; accent-color:var(--accent); height:20px; min-width:60px;}
.tval{flex:0 0 58px; text-align:right; font-size:12.5px; color:var(--muted);}
.tval .ttg{color:var(--accent); font-weight:500;}
.tdel{flex:none; border:none; background:none; color:#B3402A; cursor:pointer; font-size:12px; padding:0 2px;}
.taddrow{margin-top:9px;}
.tadd{font-size:12px; padding:4px 9px;}

/* radar */
.radar-body{flex:1; padding:8px; position:relative; min-height:0;}

/* selection handles */
.h{position:absolute; width:11px; height:11px; background:#fff; border:1.5px solid var(--sel); border-radius:2px; z-index:5;}
.h-br{right:-6px; bottom:-6px; cursor:nwse-resize;}
.h-r{right:-6px; top:50%; transform:translateY(-50%); cursor:ew-resize;}
.h-end{border-radius:50%; cursor:grab;}
.obj-del{position:absolute; top:-11px; right:-11px; width:20px; height:20px; border-radius:50%; background:#fff; border:1.5px solid var(--sel); color:var(--ink); font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; z-index:6;}
.obj-del:hover{background:#FBEFEC; border-color:#B3402A; color:#B3402A;}

/* hide all editing chrome while exporting */
.capturing .obj.sel{outline:none;}
.capturing .h, .capturing .obj-del{display:none;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:13px; padding:9px 18px; border-radius:99px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:100;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand">BA Skill Radar</span>
  <span class="sep"></span>
  <button data-add="text">+ Text</button>
  <button data-add="rect">▭ Box</button>
  <button data-add="line">╱ Line</button>
  <button data-add="arrow">↗ Arrow</button>
  <button data-add="image">🖼 Image</button>
  <span class="sep"></span>
  <label class="hint" style="display:flex;align-items:center;gap:5px;">Accent <input type="color" id="accent" value="#0E7A6A"></label>
  <span class="spacer"></span>
  <span class="hint" id="tip">Click to select · drag to move · double-click text to edit</span>
  <span class="sep"></span>
  <button class="primary" id="png">Download PNG</button>
  <button id="exp">Export</button>
  <button id="imp">Import</button>
  <button id="reset">Reset</button>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
</div>

<div id="boardwrap"><div id="board"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const uid = () => 'o'+Math.random().toString(36).slice(2,8);
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; }
function mix(hex,t,w){ const a=parseInt(hex.slice(1),16),b=parseInt(t.slice(1),16);
  const c=s=>Math.round(((a>>s)&255)*(1-w)+((b>>s)&255)*w); return '#'+((1<<24)+(c(16)<<16)+(c(8)<<8)+c(0)).toString(16).slice(1); }

// ---- Default content ----
const DEFAULT_SKILLS = [
  {n:'Requirement elicitation', cur:2.5, tg:4},
  {n:'Requirement documentation', cur:2, tg:4},
  {n:'Process analysis / flowchart', cur:2, tg:3.5},
  {n:'UAT & test scenarios', cur:1.5, tg:4},
  {n:'CR & meeting management', cur:2, tg:4},
  {n:'Customer communication', cur:3, tg:4},
  {n:'Dev/QA collaboration', cur:2.5, tg:4}
];
function defaultState(){
  return {
    skills: clone(DEFAULT_SKILLS),
    accent: '#0E7A6A',
    nextZ: 10,
    objects: [
      {id:'title', type:'text', x:0.035, y:0.05, w:0.55, size:34, bold:true, color:'#1B2A3A', text:'BA Skill Radar', z:1},
      {id:'table', type:'table', x:0.035, y:0.20, w:0.44, z:2},
      {id:'radar', type:'radar', x:0.50, y:0.16, w:0.45, h:0.70, z:3}
    ]
  };
}
const SINGLETONS = ['table','radar']; // always present, not deletable

// ---- State + persistence ----
const KEY = 'ba-canvas-v1';
let state = defaultState();
try{
  const saved = localStorage.getItem(KEY);
  if(saved){
    const s = JSON.parse(saved);
    if(s && Array.isArray(s.objects)) state = Object.assign(defaultState(), s);
  }else{
    // seed skills from the previous (pre-canvas) tool if it was used in this browser
    const old = localStorage.getItem('ba-skill-radar-en-v2') || localStorage.getItem('ba-skill-radar-v2');
    if(old){ const o = JSON.parse(old);
      if(o && Array.isArray(o.skills) && o.skills.length)
        state.skills = o.skills.map(k=>({n:k.n, cur:k.cur, tg:k.tg})); }
  }
}catch(e){}
ensureSingletons();
function ensureSingletons(){
  const def = defaultState();
  SINGLETONS.forEach(id=>{ if(!state.objects.find(o=>o.id===id)) state.objects.push(def.objects.find(o=>o.id===id)); });
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function obj(id){ return state.objects.find(o=>o.id===id); }

// ---- Board sizing (responsive, fixed 16:9; coords are fractions of board) ----
const board = $('#board'), boardwrap = $('#boardwrap');
let BW = 1280, BH = 720;
function sizeBoard(){
  const avail = boardwrap.clientWidth - 48;
  BW = clamp(Math.round(avail), 360, 1500);
  BH = Math.round(BW * 9/16);
  board.style.width = BW+'px'; board.style.height = BH+'px';
  renderBoard();
}
const SCALE = () => BW/1600; // font/stroke scale vs 1600-px baseline

// ---- Chart ----
let chart = null;
function chartCfg(){
  const a = state.accent, g = '#8A95A1';
  return {
    type:'radar',
    data:{ labels: state.skills.map(s=>s.n), datasets:[
      {label:'Current', data:state.skills.map(s=>s.cur), borderColor:g, backgroundColor:hexA(g,0.12), borderDash:[6,4], pointRadius:2.5, borderWidth:2},
      {label:'Target', data:state.skills.map(s=>s.tg), borderColor:a, backgroundColor:hexA(a,0.14), pointRadius:2.5, borderWidth:2}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{display:true, labels:{boxWidth:12, font:{size:11}}}},
      scales:{ r:{ min:0, max:5, ticks:{stepSize:1, display:false}, pointLabels:{font:{size:Math.max(9, Math.round(11*SCALE()))}, color:'#1B2A3A'},
        grid:{color:'rgba(27,42,58,0.16)'}, angleLines:{color:'rgba(27,42,58,0.16)'} } } }
  };
}
function buildChart(){
  const cv = board.querySelector('#radarCanvas'); if(!cv) return;
  if(chart){ chart.destroy(); chart = null; }
  chart = new Chart(cv, chartCfg());
}
function syncChart(){
  if(!chart) return;
  chart.data.labels = state.skills.map(s=>s.n);
  chart.data.datasets[0].data = state.skills.map(s=>s.cur);
  chart.data.datasets[1].data = state.skills.map(s=>s.tg);
  chart.data.datasets[1].borderColor = state.accent; chart.data.datasets[1].backgroundColor = hexA(state.accent,0.14);
  chart.update('none');
}

// ---- Render ----
let selected = null, editing = null;
function px(o){ // bounding box in pixels for box-type objects
  return {l:o.x*BW, t:o.y*BH, w:o.w*BW, h:(o.h!=null?o.h*BH:null)};
}
function renderBoard(){
  board.querySelectorAll('.obj').forEach(n=>n.remove());
  state.objects.slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(o=> board.appendChild(makeEl(o)) );
  buildChart();
  decorate();
}
function makeEl(o){
  const el = document.createElement('div');
  el.className = 'obj '+o.type; el.dataset.id = o.id; el.style.zIndex = o.z||1;
  if(o.type==='line'){
    layoutLine(el,o);
  }else{
    const b = px(o);
    el.style.left=b.l+'px'; el.style.top=b.t+'px'; el.style.width=b.w+'px';
    if(b.h!=null) el.style.height=b.h+'px';
  }
  if(o.type==='text'){
    el.innerHTML = '<div class="obj-text" style="font-size:'+(o.size*SCALE())+'px;font-weight:'+(o.bold?600:400)+';color:'+(o.color||'#1B2A3A')+'">'+esc(o.text||'')+'</div>';
  }else if(o.type==='rect'){
    el.innerHTML = '<div class="obj-rect" style="border:2px solid '+(o.color||state.accent)+';background:'+(o.fill||hexA(o.color||state.accent,0.06))+';border-radius:'+(o.round?10:2)+'px"></div>';
  }else if(o.type==='image'){
    el.innerHTML = '<img class="obj-img" src="'+o.src+'" alt="">';
  }else if(o.type==='line'){
    drawLine(el,o);
  }else if(o.type==='table'){
    el.classList.add('widget'); el.innerHTML = tableHTML();
  }else if(o.type==='radar'){
    el.classList.add('widget');
    el.innerHTML = '<div class="w-head"><span class="w-grip">⠿</span>Radar</div><div class="radar-body"><canvas id="radarCanvas"></canvas></div>';
  }
  return el;
}

// ----- line / arrow -----
function lineBox(o){ const pad=10;
  return { l:Math.min(o.x1,o.x2)*BW-pad, t:Math.min(o.y1,o.y2)*BH-pad,
           w:Math.abs(o.x2-o.x1)*BW+2*pad, h:Math.abs(o.y2-o.y1)*BH+2*pad, pad }; }
function layoutLine(el,o){ const b=lineBox(o);
  el.style.left=b.l+'px'; el.style.top=b.t+'px'; el.style.width=b.w+'px'; el.style.height=b.h+'px'; }
function drawLine(el,o){ const b=lineBox(o);
  const x1=o.x1*BW-b.l, y1=o.y1*BH-b.t, x2=o.x2*BW-b.l, y2=o.y2*BH-b.t;
  const col=o.color||state.accent, mid='m'+o.id;
  el.innerHTML =
    '<svg class="obj-line" width="'+b.w+'" height="'+b.h+'">'
    + (o.arrow?'<defs><marker id="'+mid+'" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="'+col+'"/></marker></defs>':'')
    + '<line class="hit" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>'
    + '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="2.5" stroke-linecap="round"'+(o.arrow?' marker-end="url(#'+mid+')"':'')+'/>'
    + '</svg>'; }

// ----- score table (slider style) -----
let tableMode = 'cur'; // which line the sliders adjust: 'cur' or 'tg'
function fmt(v){ return Number(v).toFixed(1); }
function tableHTML(){
  let rows = '';
  state.skills.forEach((s,i)=>{
    rows += '<div class="trow">'
      + '<input class="tname" data-i="'+i+'" value="'+esc(s.n)+'">'
      + '<input class="tslider" type="range" min="1" max="5" step="0.5" data-i="'+i+'" value="'+(tableMode==='cur'?s.cur:s.tg)+'" aria-label="'+esc(s.n)+'">'
      + '<span class="tval mono"><span class="tcur">'+fmt(s.cur)+'</span> → <span class="ttg">'+fmt(s.tg)+'</span></span>'
      + '<button class="tdel" data-del="'+i+'" title="Remove">✕</button></div>';
  });
  const toggle = '<div class="tmode">'
    + '<button data-mode="cur"'+(tableMode==='cur'?' class="on"':'')+'>Current</button>'
    + '<button data-mode="tg"'+(tableMode==='tg'?' class="on"':'')+'>Target</button></div>';
  return '<div class="w-head"><span class="w-grip">⠿</span>Score table</div>'
    + '<div class="w-body">'+toggle+rows+'<div class="taddrow"><button class="tadd" id="addSkill">+ Skill</button></div></div>';
}

// ---- Selection + handles ----
function decorate(){
  board.querySelectorAll('.obj').forEach(n=>{ n.classList.remove('sel'); n.querySelectorAll('.h,.obj-del').forEach(h=>h.remove()); });
  if(!selected) return;
  const o = obj(selected); if(!o) return;
  const el = board.querySelector('.obj[data-id="'+selected+'"]'); if(!el) return;
  el.classList.add('sel');
  if(!SINGLETONS.includes(o.id)){ const d=document.createElement('button'); d.className='obj-del'; d.textContent='✕'; el.appendChild(d); }
  if(o.type==='line'){
    const b=lineBox(o);
    addHandle(el,'h-end', o.x1*BW-b.l-5, o.y1*BH-b.t-5, 'p1');
    addHandle(el,'h-end', o.x2*BW-b.l-5, o.y2*BH-b.t-5, 'p2');
  }else if(o.type==='rect' || o.type==='radar'){
    const h=document.createElement('div'); h.className='h h-br'; h.dataset.dir='br'; el.appendChild(h);
  }else{ // text / table / image → width-only
    const h=document.createElement('div'); h.className='h h-r'; h.dataset.dir='r'; el.appendChild(h);
  }
}
function addHandle(el,cls,x,y,dir){ const h=document.createElement('div'); h.className='h '+cls; h.style.left=x+'px'; h.style.top=y+'px'; h.dataset.dir=dir; el.appendChild(h); }
function select(id){ selected=id; if(id){ const o=obj(id); if(o){ o.z=++state.nextZ; const el=board.querySelector('.obj[data-id="'+id+'"]'); if(el) el.style.zIndex=o.z; } } decorate(); }

// ---- Pointer: move + resize ----
let drag = null;
board.addEventListener('pointerdown', e=>{
  const handle = e.target.closest('.h');
  const del = e.target.closest('.obj-del');
  const el = e.target.closest('.obj');
  if(del){ e.preventDefault(); deleteObj(el.dataset.id); return; }
  if(!el){ if(editing) commitEdit(); select(null); return; }
  const id = el.dataset.id, o = obj(id);
  // interacting with inputs / editing text → don't drag, just select
  if(e.target.matches('input,button') || (editing===id && e.target.closest('.obj-text'))){ select(id); return; }
  const headOnly = (o.type==='table'||o.type==='radar');
  if(handle){ select(id); startResize(e,o,handle.dataset.dir); return; }
  if(headOnly && !e.target.closest('.w-head')){ select(id); return; } // body of widget = interact, header = move
  select(id);
  startMove(e,o);
});
function startMove(e,o){
  e.preventDefault();
  if(o.type==='line'){ drag={mode:'lmove', o, sx:e.clientX, sy:e.clientY, x1:o.x1,y1:o.y1,x2:o.x2,y2:o.y2}; }
  else drag={mode:'move', o, sx:e.clientX, sy:e.clientY, ox:o.x, oy:o.y};
  window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', endDrag);
}
function startResize(e,o,dir){
  e.preventDefault();
  if(dir==='p1'||dir==='p2'){ drag={mode:'lpt', o, dir}; }
  else drag={mode:'resize', o, dir, sx:e.clientX, sy:e.clientY, ow:o.w, oh:o.h};
  window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', endDrag);
}
function onMove(e){
  if(!drag) return;
  const o = drag.o, el = board.querySelector('.obj[data-id="'+o.id+'"]'); if(!el) return;
  const dfx=(e.clientX-drag.sx)/BW, dfy=(e.clientY-drag.sy)/BH;
  if(drag.mode==='move'){
    o.x = clamp(drag.ox+dfx, 0, 1-(o.w||0.05)); o.y = clamp(drag.oy+dfy, 0, 0.99);
    el.style.left=o.x*BW+'px'; el.style.top=o.y*BH+'px';
  }else if(drag.mode==='resize'){
    o.w = clamp(drag.ow+dfx, 0.06, 1); el.style.width=o.w*BW+'px';
    if(drag.dir==='br' && o.h!=null){ o.h=clamp(drag.oh+dfy, 0.06, 1); el.style.height=o.h*BH+'px'; if(o.type==='radar'&&chart) chart.resize(); }
    positionHandles(el,o);
  }else if(drag.mode==='lmove'){
    o.x1=drag.x1+dfx; o.y1=drag.y1+dfy; o.x2=drag.x2+dfx; o.y2=drag.y2+dfy;
    layoutLine(el,o); drawLine(el,o); decorate();
  }else if(drag.mode==='lpt'){
    const fx=clamp((e.clientX-board.getBoundingClientRect().left)/BW,0,1), fy=clamp((e.clientY-board.getBoundingClientRect().top)/BH,0,1);
    if(drag.dir==='p1'){ o.x1=fx; o.y1=fy; } else { o.x2=fx; o.y2=fy; }
    layoutLine(el,o); drawLine(el,o); decorate();
  }
}
function positionHandles(el,o){ // keep width/corner handle pinned after live resize (text auto-height etc.)
  // CSS already pins .h-r / .h-br relative to el; nothing needed for box types
}
function endDrag(){ if(drag){ drag=null; persist(); } window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',endDrag); }

// ---- Text editing ----
board.addEventListener('dblclick', e=>{
  const t = e.target.closest('.obj-text'); if(!t) return;
  const el = t.closest('.obj'); editing = el.dataset.id;
  t.classList.add('editing'); t.contentEditable='true'; t.focus();
  const r=document.createRange(); r.selectNodeContents(t); const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
});
function commitEdit(){
  if(!editing) return;
  const el=board.querySelector('.obj[data-id="'+editing+'"]'); const t=el&&el.querySelector('.obj-text');
  if(t){ const o=obj(editing); if(o){ o.text=t.innerText.trim(); } t.classList.remove('editing'); t.contentEditable='false'; }
  editing=null; persist();
}
board.addEventListener('focusout', e=>{ if(e.target.classList && e.target.classList.contains('obj-text')) commitEdit(); });

// ---- Score table edits ----
board.addEventListener('input', e=>{
  const t=e.target;
  if(t.classList.contains('tname')){ state.skills[+t.dataset.i].n=t.value; syncChart(); persist(); }
  else if(t.classList.contains('tslider')){
    const i=+t.dataset.i, v=parseFloat(t.value); state.skills[i][tableMode]=v;
    const row=t.closest('.trow'); row.querySelector('.tcur').textContent=fmt(state.skills[i].cur); row.querySelector('.ttg').textContent=fmt(state.skills[i].tg);
    syncChart(); persist();
  }
});
board.addEventListener('click', e=>{
  const m=e.target.closest('[data-mode]');
  if(m){ tableMode=m.dataset.mode;
    board.querySelectorAll('.tmode button').forEach(b=>b.classList.toggle('on', b.dataset.mode===tableMode));
    board.querySelectorAll('.tslider').forEach(sl=>{ sl.value=state.skills[+sl.dataset.i][tableMode]; });
    return; }
  const add=e.target.closest('#addSkill');
  if(add){ state.skills.push({n:'New skill', cur:2, tg:4}); rebuildTable(); syncChart(); persist(); return; }
  const del=e.target.closest('.tdel');
  if(del){ if(state.skills.length<=3){ toast('Keep at least 3 skills'); return; } state.skills.splice(+del.dataset.del,1); rebuildTable(); syncChart(); persist(); }
});
function rebuildTable(){ const el=board.querySelector('.obj[data-id="table"]'); if(el){ el.innerHTML=tableHTML(); decorate(); } }

// ---- Add objects ----
function addObj(o){ o.id=uid(); o.z=++state.nextZ; state.objects.push(o); renderBoard(); select(o.id); persist(); }
$('#toolbar').addEventListener('click', e=>{
  const b=e.target.closest('[data-add]'); if(!b) return;
  const t=b.dataset.add;
  if(t==='text') addObj({type:'text', x:0.30, y:0.42, w:0.24, size:22, bold:false, color:'#1B2A3A', text:'Text'});
  else if(t==='rect') addObj({type:'rect', x:0.30, y:0.40, w:0.22, h:0.16, color:state.accent, fill:hexA(state.accent,0.06), round:true});
  else if(t==='line') addObj({type:'line', x1:0.30, y1:0.50, x2:0.46, y2:0.50, arrow:false, color:state.accent});
  else if(t==='arrow') addObj({type:'line', x1:0.30, y1:0.55, x2:0.46, y2:0.55, arrow:true, color:state.accent});
  else if(t==='image') $('#imgFile').click();
});
$('#imgFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ addObj({type:'image', x:0.30, y:0.30, w:0.22, src:r.result}); };
  r.readAsDataURL(f); e.target.value='';
});

// ---- Delete ----
function deleteObj(id){ if(SINGLETONS.includes(id)) return; state.objects=state.objects.filter(o=>o.id!==id); if(selected===id) selected=null; renderBoard(); persist(); }
document.addEventListener('keydown', e=>{
  if((e.key==='Delete'||e.key==='Backspace') && selected && !editing){
    const a=document.activeElement; if(a&&a.matches('input,[contenteditable="true"]')) return;
    e.preventDefault(); deleteObj(selected);
  }
});

// ---- Accent color ----
$('#accent').addEventListener('input', e=>{
  state.accent=e.target.value;
  document.documentElement.style.setProperty('--accent', state.accent);
  document.documentElement.style.setProperty('--accent-deep', mix(state.accent,'#000000',0.25));
  document.documentElement.style.setProperty('--sel', state.accent);
  syncChart(); persist();
});

// ---- Export / Import / Reset / PNG ----
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1700); }
$('#exp').addEventListener('click', ()=>{
  const a=document.createElement('a'); a.download='ba-canvas.json';
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state,null,2)); a.click(); toast('Exported');
});
$('#imp').addEventListener('click', ()=>$('#impFile').click());
$('#impFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s||!Array.isArray(s.objects)||!Array.isArray(s.skills)) throw 0;
    state=Object.assign(defaultState(), s); ensureSingletons(); selected=null; applyAccent(); sizeBoard(); persist(); toast('Imported');
  }catch(err){ toast('Invalid file'); } e.target.value=''; };
  r.readAsText(f);
});
$('#reset').addEventListener('click', ()=>{ if(!confirm('Reset the whole canvas to defaults?')) return; state=defaultState(); selected=null; applyAccent(); sizeBoard(); persist(); toast('Reset'); });
$('#png').addEventListener('click', ()=>{
  if(typeof html2canvas!=='function'){ toast('Image library not loaded'); return; }
  const wasSel=selected; selected=null; decorate(); document.body.classList.add('capturing');
  html2canvas(board, {backgroundColor:'#FFFFFF', scale:2, useCORS:true})
    .then(c=>{ const a=document.createElement('a'); a.download='ba-skill-radar.png'; a.href=c.toDataURL('image/png'); a.click(); toast('PNG downloaded'); })
    .catch(()=>toast('Could not render image'))
    .finally(()=>{ document.body.classList.remove('capturing'); selected=wasSel; decorate(); });
});

function applyAccent(){
  $('#accent').value=state.accent;
  const r=document.documentElement.style;
  r.setProperty('--accent', state.accent); r.setProperty('--accent-deep', mix(state.accent,'#000000',0.25)); r.setProperty('--sel', state.accent);
}

// ---- Init ----
let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(sizeBoard,120); });
applyAccent(); sizeBoard();
</script>
</body>
</html>
